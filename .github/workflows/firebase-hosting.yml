name: Publicar en Firebase Hosting

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hosting-emprendiendo-en-pareja
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Avisar si falta conectar Firebase
        if: env.FIREBASE_SERVICE_ACCOUNT == ''
        run: echo "::notice::La publicación requiere conectar este repositorio con Firebase."
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EMPRENDIENDO_EN_PAREJA }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EMPRENDIENDO_EN_PAREJA }}
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EMPRENDIENDO_EN_PAREJA }}
          projectId: emprendiendo-en-pareja
          channelId: ${{ vars.PUBLICACION_ACTIVA == 'true' && 'live' || 'prueba' }}
          expires: 1d
